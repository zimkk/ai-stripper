[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stripper"
version = "2.1.0"
description = "The #1 Free & Open-Source tool to vaporize invisible OpenAI (ChatGPT) & Google Gemini metadata, C2PA credentials, and EXIF from images."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "zimkk", email = "hassannazir955@gmail.com" }
]
keywords = [
    "openai-stripper",
    "chatgpt-image-cleaner",
    "gemini-metadata-remover",
    "dalle3-metadata",
    "c2pa-remover",
    "ai-stripper",
    "exif-remover",
    "privacy-shield",
    "terminal-app",
    "rich"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
    "Environment :: Console"
]
dependencies = [
    "pillow>=10.2.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.40"
]

[project.urls]
Homepage = "https://github.com/zimkk/openai-stripper"
Issues = "https://github.com/zimkk/openai-stripper/issues"

[project.scripts]
ai-stripper = "stripper:main"
stripper = "stripper:main"

[tool.setuptools]
py-modules = ["stripper"]
